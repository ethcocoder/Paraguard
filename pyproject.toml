[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paraguard"
version = "0.1.0"
description = "Offline spectral analysis of exported security events"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.scripts]
paraguard = "paraguard.cli:main"

[tool.setuptools.packages.find]
include = ["paraguard*"]